[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/kontakt"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/kontakt/*"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/sondag-montenegro-dold-parla"
  to = "/montenegro-dold-parla"
  status = 301
  force = true
